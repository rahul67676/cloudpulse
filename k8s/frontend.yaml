apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 921040036993.dkr.ecr.us-west-1.amazonaws.com/cloudpulse:frontend-latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloudpulse
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
