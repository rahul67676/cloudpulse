apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: cloudpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: 921040036993.dkr.ecr.us-west-1.amazonaws.com/cloudpulse:product-latest
          ports:
            - containerPort: 3001

          env:
            - name: DB_HOST
              value: mysql

            - name: DB_USER
              value: cloudpulse

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

            - name: DB_NAME
              value: cloudpulse

            - name: DB_PORT
              value: "3306"

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: cloudpulse
spec:
  selector:
    app: product-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
